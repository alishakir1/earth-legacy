<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07171e"><meta name="color-scheme" content="dark"><title>Earth Legacy</title><link rel="icon" href="brand/app-icon.webp"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="earth.css"><link rel="stylesheet" href="experience.css"><link rel="stylesheet" href="chronicle.css"></head><body>
<div id="splash" class="screen splash"><img src="brand/studio.jpg" alt="404 Artifact — The past, reinvented" fetchpriority="high"><button id="skipSplash" class="quiet" onclick="finishSplash()">تخطي · Skip</button></div>
<div id="language" class="screen welcome hidden"><img class="app-emblem" src="brand/app-icon.webp" alt="Earth Legacy"><div class="eyebrow" dir="ltr">404 ARTIFACT PRESENTS</div><h1>EARTH<br><span>LEGACY</span></h1><p class="welcome-line">كل قطعة تحكي حكاية</p><p class="muted">اختر لغتك · Choose your language</p><div class="language-choices"><button class="primary" onclick="chooseLanguage('ar')"><strong>العربية</strong><span>AR</span></button><button onclick="chooseLanguage('en')"><strong>English</strong><span>EN</span></button></div><small id="loadStatus" role="status">جاري تجهيز رحلتك · Preparing your journey</small></div>
<div id="map" class="screen main-screen hidden"><header><div class="brand-lockup"><img src="brand/app-icon.webp" alt=""><b class="brand">EARTH LEGACY</b></div><span id="mapBadge" class="pill"></span></header><div class="map-heading"><div class="eyebrow" id="journeyLabel"></div><h2 id="mapTitle"></h2><p id="progress"></p><div class="progress-track"><span id="journeyProgress"></span></div></div><p id="journeyStats" class="journey-stats"></p><canvas id="globe" aria-label="Interactive globe"></canvas><div class="globe-tools"><button onclick="zoomGlobe(1.15)" aria-label="Zoom in">＋</button><span id="rotateHint"></span><button onclick="zoomGlobe(.87)" aria-label="Zoom out">−</button></div><div id="levelStrip" class="level-strip" aria-label="Levels"></div><section class="destination"><div class="destination-art"><img id="thumb" alt=""><span aria-hidden="true">?</span></div><div><small id="levelLabel"></small><h2 id="personName"></h2><p id="country"></p><p id="destinationState"></p><div id="destinationProgress" class="destination-progress hidden"><span></span></div></div><button id="playButton" class="primary" onclick="openPuzzle()"></button></section><div class="difficulty" aria-live="polite"><span id="piecesLabel"></span><strong id="difficultyValue"></strong><span id="difficultyPieces"></span></div><p id="mapNote" class="footnote"></p><section class="journey-extras"><button id="chapterButton" onclick="showJournal()"></button><p id="chapterCaption"></p><div class="daily-card"><div><h3 id="dailyTitle"></h3><p id="dailyDescription"></p></div><button id="dailyPlay" onclick="startDaily()"></button></div></section></div>
<div id="puzzle" class="screen hidden">
<header id="puzzleToolbar" class="puzzle-toolbar" role="toolbar">
<button id="backPuzzle" onclick="leavePuzzle()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h14"/></svg><span></span></button>
<button id="clearWrong" onclick="clearWrongPieces()"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-dasharray="2 3" d="M11 3H3v18h7M15 3h6v7"/><path d="M21 13h-4a2.5 2.5 0 1 0-4 0v4a2.5 2.5 0 1 0 0 4h8Z"/></svg><span></span></button>
<button id="placePage" onclick="placeVisiblePage()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 15c0-2-3-3-3-7a7 7 0 0 1 14 0c0 4-3 5-3 7v1H8Z"/><path d="m10 8 2 2 3-3"/></svg><span></span></button>
<button id="hint" onclick="toggleHint()" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span></span></button>
<button id="previewImage" onclick="showImagePreview()" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H3v14m4-14h10"/><rect x="7" y="7" width="14" height="14" rx="2"/><circle cx="16.5" cy="11.5" r="1"/><path d="m8 19 4-5 3 3 2-2 4 4"/></svg><span></span></button>
</header><div class="puzzle-caption"><b id="puzzleTitle"></b><span id="puzzleStatus" role="status"></span></div><div id="puzzleProgress" class="puzzle-progress" role="progressbar" aria-valuemin="0"><span id="puzzleProgressFill"></span></div><p id="puzzleHelp" class="center muted"></p>
<div class="puzzle-workspace"><section class="board-station"><div class="board-controls"><button id="panBoard" onclick="toggleBoardPan()" aria-pressed="false"></button><div class="board-zoom"><button id="zoomOutBoard" onclick="changeBoardZoom(-.5)">−</button><button id="zoomResetBoard" onclick="changeBoardZoom(0)">100%</button><button id="zoomInBoard" onclick="changeBoardZoom(.5)">＋</button></div></div><div id="boardViewport" class="board-viewport"><canvas id="board" aria-label="Jigsaw puzzle board"></canvas></div></section>
<section class="piece-station"><div class="tray-filters"><button id="allPieces" onclick="setTrayFilter('all')" aria-pressed="true"></button><button id="edgePieces" onclick="setTrayFilter('edges')" aria-pressed="false"></button></div><div class="tray-wrap"><canvas id="tray" aria-label="Puzzle pieces"></canvas><div id="trayEmpty" class="tray-empty hidden"><p id="trayEmptyText"></p><button id="showAllPieces" onclick="setTrayFilter('all')"></button></div></div><div class="tray-controls"><button onclick="pageTray(-1)" aria-label="Previous pieces">‹</button><span id="trayPage"></span><button onclick="pageTray(1)" aria-label="Next pieces">›</button></div><div class="puzzle-footer"><button id="returnPiece" class="return-piece" onclick="returnSelectedPiece()" disabled></button><button id="restart" onclick="restartPuzzle()"></button></div></section></div><img id="dragGhost" class="hidden" alt=""></div>
<div id="museum" class="screen main-screen hidden"><header><h1 id="museumTitle"></h1><span id="museumCount" class="pill"></span></header><section class="museum-intro"><div class="eyebrow" id="museumEyebrow"></div><h2 id="museumHeadline"></h2><p class="muted" id="museumIntro"></p></section><section id="museumWelcome" class="museum-welcome hidden"><span aria-hidden="true">◇</span><h3 id="museumWelcomeTitle"></h3><p id="museumWelcomeText"></p><button id="museumJourney" onclick="startMuseumJourney()"></button></section><section id="recentFinds" class="recent-finds hidden"><h3 id="recentTitle"></h3><div id="recentCards"></div></section><div class="wing-filters"></div><div class="museum-filters"><button id="allCollections" onclick="setMuseumView('all')" aria-pressed="true"></button><button id="ownedCollections" onclick="setMuseumView('owned')" aria-pressed="false"></button></div><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="museumSearch" type="search" oninput="renderCivilizations()" autocomplete="off"></label><div id="civilizationGrid" class="civilization-grid"></div><p id="museumNoResults" class="empty-state hidden"></p></div>
<div id="collection" class="screen main-screen hidden"><header><button id="backCollection" onclick="museum()"></button><b id="collectionTitle"></b><span id="collectionCount" class="pill"></span></header><p id="collectionDescription" class="muted center"></p><div class="wing-filters"></div><p id="wingNote"></p><section id="galleryHall" class="gallery-hall"><h2 id="roomStage"></h2><div id="museumGrid" class="museum-grid"></div></section><p id="roomNote"></p><div id="collectionEmpty" class="empty-state hidden"><div class="empty-symbol">◇</div><h2 id="emptyCollectionTitle"></h2><p id="emptyCollectionText"></p><button id="emptyCollectionPlay" class="primary" onclick="showMap()"></button></div></div>
<div id="me" class="screen main-screen hidden"><header><h1 id="meTitle"></h1><span class="pill">0.5.0</span></header><section class="profile-hero"><img src="brand/app-icon.webp" alt=""><div><div class="eyebrow">EARTH LEGACY</div><h2 id="explorerTitle"></h2><p id="explorerSubtitle" class="muted"></p></div></section><div class="profile-stats"><div><strong id="statCompleted"></strong><span id="statCompletedLabel"></span></div><div><strong id="statCivs"></strong><span id="statCivsLabel"></span></div><div><strong id="statNext"></strong><span id="statNextLabel"></span></div></div><div id="profileMenu" class="profile-menu"></div><p id="prototypeNote" class="footnote"></p><footer class="studio-credit">404 ARTIFACT <span>THE PAST, REINVENTED</span></footer></div>
<nav id="bottomNav" class="bottom-nav hidden" aria-label="Main navigation"><button id="tabEarth" data-tab="map" onclick="showMap()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5c4 2 10 2 14 0M5 17.5c4-2 10-2 14 0"/></svg><span></span></button><button id="tabMuseum" data-tab="museum" onclick="museum()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 8 9-5 9 5H3Zm2 3v7m5-7v7m4-7v7m5-7v7M3 21h18M3 18h18"/></svg><span></span></button><button id="tabMe" data-tab="me" onclick="showMe()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span></span></button></nav>
<dialog id="card" aria-labelledby="cardTitle"><button id="closeCard" class="dialog-close" onclick="closeCard()" aria-label="Close">×</button><div id="cardBody"></div><div id="cardActions" class="card-actions"><button id="nextLevel" class="primary" onclick="nextLevel()"></button><button id="cardMuseum" onclick="visitCardCollection()" class="hidden"></button></div></dialog>
<dialog id="journalDialog" aria-labelledby="journalTitle"><div class="sheet-header"><h2 id="journalTitle"></h2><button id="closeJournal" class="dialog-close" onclick="closeJournal()">×</button></div><div id="journalBody"></div></dialog><dialog id="infoDialog" aria-labelledby="infoTitle"><div class="sheet-header"><h2 id="infoTitle"></h2><button class="dialog-close" onclick="closeInfo()" aria-label="Close">×</button></div><div id="infoBody"></div></dialog>
<dialog id="imagePreview" aria-labelledby="imagePreviewTitle"><div class="sheet-header"><h2 id="imagePreviewTitle"></h2><button id="closeImagePreview" class="dialog-close" onclick="closeImagePreview()">×</button></div><img id="previewPicture" alt=""></dialog>
<dialog id="resumeDialog" class="resume-dialog" aria-labelledby="resumeTitle" aria-describedby="resumeWarning"><h2 id="resumeTitle" class="sr-only"></h2><div class="resume-preview"><img id="resumeImage" alt=""><span id="resumePieceCount"></span></div><div class="resume-actions"><p id="resumeWarning"></p><button id="continuePuzzle" onclick="continueSavedPuzzle()" autofocus></button><button id="restartSaved" onclick="restartSavedPuzzle()"></button><button id="cancelResume" onclick="cancelResume()"></button></div></dialog>
<div id="toast" role="status"></div><script src="vendor/d3.min.js"></script><script src="app.js"></script><script src="puzzle.js"></script><script src="experience.js"></script><script src="chronicle.js"></script><script src="earth.js"></script></body></html>
